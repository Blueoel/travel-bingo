name: travel-bingo

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: travel_bingo
      POSTGRES_USER: travel_bingo
      POSTGRES_PASSWORD: travel_bingo
    ports:
      - "55432:5432"
    volumes:
      - travel-bingo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_bingo -d travel_bingo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - travel-bingo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: travel_bingo
      MINIO_ROOT_PASSWORD: travel_bingo_local_only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - travel-bingo-minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 travel_bingo travel_bingo_local_only &&
        mc mb --ignore-existing local/travel-bingo-local
    restart: "no"

volumes:
  travel-bingo-postgres:
  travel-bingo-redis:
  travel-bingo-minio:
