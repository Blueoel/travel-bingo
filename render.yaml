services:
  - type: web
    name: travel-bingo-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://travel-bingo-walk.blueo03.chatgpt.site
      - key: DATABASE_URL
        fromDatabase:
          name: travel-bingo-db
          property: connectionString

databases:
  - name: travel-bingo-db
    region: singapore
    plan: free
    databaseName: travel_bingo
    user: travel_bingo
    postgresMajorVersion: "17"
    ipAllowList: []
