services:
  - type: web
    name: travel-bingo-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://travel-bingo-walk.blueo03.chatgpt.site,https://app.travelbingo.kr
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://app.travelbingo.kr
