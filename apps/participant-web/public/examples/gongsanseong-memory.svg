<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">공산성에서 남긴 여행의 한 장</title>
  <desc id="desc">푸른 산과 금강을 내려다보는 공산성 성곽의 여행 사진형 일러스트</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91bed0"/>
      <stop offset="0.55" stop-color="#dce3c8"/>
      <stop offset="1" stop-color="#f0d49e"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365e4d"/>
      <stop offset="1" stop-color="#78936b"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd6d1"/>
      <stop offset="1" stop-color="#5c8d91"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.7" numOctaves="2" seed="7" type="fractalNoise" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="920" cy="145" r="72" fill="#fff6c9" opacity="0.8"/>
  <path d="M0 420 130 318 240 365 365 240 500 364 650 225 820 355 960 250 1200 390V800H0Z" fill="url(#mountain)"/>
  <path d="M0 510C250 440 425 520 604 487c196-36 339-4 596-92v405H0Z" fill="#708b62"/>
  <path d="M0 650c217-76 367-17 526-50 218-45 398 8 674-103v303H0Z" fill="url(#river)"/>
  <path d="M120 585c170-64 298-86 436-86 167 0 300 47 514-38" fill="none" stroke="#d8bd82" stroke-width="34" stroke-linecap="round"/>
  <path d="M105 565c176-66 310-91 453-91 174 0 312 47 526-39" fill="none" stroke="#a27b4f" stroke-width="15" stroke-linecap="round"/>
  <g transform="translate(735 348)">
    <rect x="0" y="105" width="210" height="95" rx="8" fill="#e6d6ad" stroke="#735b3e" stroke-width="8"/>
    <rect x="79" y="126" width="54" height="74" fill="#573d2e"/>
    <path d="M-24 112 105 30l129 82Z" fill="#72523b" stroke="#49362b" stroke-width="9"/>
    <path d="M18 103 105 48l87 55" fill="none" stroke="#dfc17e" stroke-width="8"/>
  </g>
  <g fill="#244c39">
    <circle cx="190" cy="505" r="53"/><circle cx="255" cy="484" r="45"/><circle cx="1015" cy="443" r="63"/><circle cx="1085" cy="418" r="48"/>
  </g>
  <rect width="1200" height="800" fill="transparent" filter="url(#grain)"/>
  <rect x="34" y="34" width="1132" height="732" rx="26" fill="none" stroke="#fff8e8" stroke-width="9" opacity="0.65"/>
  <g transform="translate(62 670)">
    <rect width="430" height="78" rx="39" fill="#193f31" opacity="0.88"/>
    <text x="38" y="34" fill="#f8f2dd" font-family="sans-serif" font-size="22" font-weight="700">TRAVEL BINGO MEMORY</text>
    <text x="38" y="61" fill="#e9d8a9" font-family="sans-serif" font-size="18">충청남도 공주시 · 공산성</text>
  </g>
